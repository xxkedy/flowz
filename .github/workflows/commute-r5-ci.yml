name: commute-r5-ci

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node --check flowz-v4.8.5-commute-continuity.js
      - run: npx playwright test tests/commute-continuity.spec.js
