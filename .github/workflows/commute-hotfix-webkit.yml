name: Commute hotfix WebKit

on:
  pull_request:
    branches: [main]

jobs:
  webkit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --browser=webkit
