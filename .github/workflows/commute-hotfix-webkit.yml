name: Commute hotfix WebKit

on:
  pull_request:
    branches: [main]

jobs:
  webkit-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --browser=webkit
