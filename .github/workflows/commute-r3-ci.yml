name: COMMUTE r3 regression

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check flowz-v4.8.5-commute-continuity.js
      - run: node --check tests/commute-continuity.spec.js
      - run: npx playwright install --with-deps webkit
      - run: npm test
