name: english-roadmap-r12-ci
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check flowz-app.js
      - run: node --check flowz-v4.8.5-commute-continuity.js
      - run: node --check flowz-v4.8.6-diary-sync.js
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --browser=webkit
