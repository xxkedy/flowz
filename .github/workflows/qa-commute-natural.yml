name: QA commute natural conversation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  webkit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply scoped v4.6.1 patch
        run: |
          python scripts/apply_commute_v461.py
          npm version 4.6.1 --no-git-tag-version
      - name: Syntax check
        run: node --check flowz-app.js
      - name: iPhone WebKit regression
        run: |
          npm ci
          npx playwright install --with-deps webkit
          npx playwright test --browser=webkit
      - name: Commit verified final tree
        shell: bash
        run: |
          rm -f .github/workflows/apply-commute-v461.yml .github/workflows/apply-commute-v461-r2.yml .github/workflows/qa-commute-natural.yml .qa-trigger-commute-v461 scripts/apply_commute_v461.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flowz-app.js flowz-v3-duo.html index.html package.json package-lock.json tests/stability.spec.js tests/commute-natural-conversation.spec.js CHANGELOG-v4.6.1.md .github/workflows/apply-commute-v461.yml .github/workflows/apply-commute-v461-r2.yml .github/workflows/qa-commute-natural.yml .qa-trigger-commute-v461 scripts/apply_commute_v461.py
          git diff --cached --check
          git commit -m "Flowz v4.6.1: prioritize natural commute conversation"
          git push origin HEAD:${{ github.head_ref }}
