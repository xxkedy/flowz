name: Patch commute natural conversation

on:
  push:
    branches:
      - fix/commute-natural-conversation-20260821

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply scoped commute prompt patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('flowz-app.js')
          s = app.read_text(encoding='utf-8')

          replacements = [
              ("number:'4.6.0'", "number:'4.6.1'"),
              ("label:'v4.6.0 (2026.8.14)'", "label:'v4.6.1 (2026.8.21)'"),
              ("title:'Flowz v4.6.0 · Duo Battle'", "title:'Flowz v4.6.1 · Duo Battle'"),
              ("footer:'✅ Last updated 2026.08.14 · Flowz v4.6.0 Unified Build'", "footer:'✅ Last updated 2026.08.21 · Flowz v4.6.1 Unified Build'"),
              (
                  '   "Conversation should be about 80 percent and shadowing about 20 percent. If he asks to talk, says stay in chat, or otherwise says he wants conversation instead of repetition, stop shadowing immediately and do not suggest it again that session.",',
                  '   "Conversation should be about 90 percent and shadowing about 10 percent. Natural conversation is the default, not a lesson sequence. If he asks to talk, says stay in chat, or otherwise says he wants conversation instead of repetition, enter conversation-only mode for the rest of that session: no shadowing, repetition drills, model-sentence drills, lesson framing, or requests to repeat. Do not suggest those again unless he explicitly asks for shadowing.",\n'
                  '   "In conversation-only mode, respond as a real conversation partner: answer his actual point first, share a short opinion or idea when natural, and ask only questions that genuinely move that topic forward. Do not turn the conversation into repeated A1 either-or prompts just because his English is simple.",\n'
                  '   "If his speech is fragmented or voice recognition is uncertain, do not silently replace a key noun or idea with a different word. Use the word you heard when possible, or ask one very short confirmation only when the meaning would materially change. After one clarification, continue the topic instead of starting a correction loop.",\n'
                  '   "Commute is background context. Do not repeatedly tell him to stay safe, focus on the road, keep steady, or use similar riding-safety reminders unless he asks about safety or there is an immediate safety concern.",'
              ),
              (
                  '   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. Allow one retry, then return to conversation.",',
                  '   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. In normal conversation, prefer one brief natural recast and keep the topic moving; do not require a retry. A retry is optional only when kedy clearly wants to practice the corrected line.",'
              ),
              (
                  '   "If kedy says another topic, other topics, 話題変えて, or clearly requests a topic switch, switch immediately to a genuinely different topic. Do not rephrase the previous topic as a new question.",',
                  '   "If kedy says another topic, other topics, 話題変えて, says he is bored by the same words, or clearly requests a topic switch, switch immediately to a genuinely different content domain. Do not rephrase the previous topic as a new question, and do not immediately return to recently rejected defaults such as mood, weather, music, food, or commute conditions.",'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old[:120]}')
              s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          test = Path('tests/stability.spec.js')
          t = test.read_text(encoding='utf-8')
          test_replacements = [
              ("expect(initial.version).toBe('v4.6.0 (2026.8.14)');", "expect(initial.version).toBe('v4.6.1 (2026.8.21)');"),
              ("expect(initial.title).toBe('Flowz v4.6.0 · Duo Battle');", "expect(initial.title).toBe('Flowz v4.6.1 · Duo Battle');"),
              ("expect(p.commute).toMatch(/about 80 percent and shadowing about 20 percent/);", "expect(p.commute).toMatch(/about 90 percent and shadowing about 10 percent/);\n  expect(p.commute).toMatch(/enter conversation-only mode for the rest of that session/);\n  expect(p.commute).toMatch(/respond as a real conversation partner/);\n  expect(p.commute).toMatch(/do not silently replace a key noun or idea/);\n  expect(p.commute).toMatch(/Commute is background context/);\n  expect(p.commute).toMatch(/do not require a retry/);"),
              ("expect(p.commute).toMatch(/switch immediately to a genuinely different topic/);", "expect(p.commute).toMatch(/switch immediately to a genuinely different content domain/);\n  expect(p.commute).toMatch(/recently rejected defaults such as mood, weather, music, food, or commute conditions/);"),
          ]
          for old, new in test_replacements:
              if old not in t:
                  raise SystemExit(f'Missing expected test text: {old}')
              t = t.replace(old, new, 1)
          test.write_text(t, encoding='utf-8')
          PY

          npm version 4.6.1 --no-git-tag-version
          cat > CHANGELOG-v4.6.1.md <<'EOF'
          # Flowz v4.6.1 — Commute natural conversation

          - Makes natural conversation the default in COMMUTE (about 90%) and reduces planned shadowing to about 10%.
          - Once kedy asks to just talk, locks the rest of that session to conversation-only mode unless he explicitly asks for shadowing.
          - Prevents uncertain voice recognition from silently replacing key nouns or ideas.
          - Removes repeated riding-safety reminders during ordinary bike commute chat.
          - Uses brief recasts instead of mandatory retries during normal conversation.
          - Strengthens genuine topic switching when kedy says the conversation is repetitive or boring.
          - Leaves Duo Sync, XP, storage, UI layout, and Leni prompts unchanged.
          EOF
      - name: Syntax check
        run: node --check flowz-app.js
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps webkit
      - name: iPhone WebKit regression
        run: npx playwright test --browser=webkit
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-commute-natural.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flowz-app.js tests/stability.spec.js package.json package-lock.json CHANGELOG-v4.6.1.md .github/workflows/patch-commute-natural.yml
          git diff --cached --check
          git commit -m "Flowz v4.6.1: prioritize natural commute conversation"
          git push origin HEAD:fix/commute-natural-conversation-20260821
