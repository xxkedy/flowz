name: Flowz v4.6.0 Leni Talk Prep

on:
  push:
    branches:
      - fix/leni-talk-prep

permissions:
  contents: write

jobs:
  apply-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/leni-talk-prep
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/flowz_v460_leni_prep.py').read_text()
          source = source.replace(
              "  getTalkPrep:function(){var m=currentCommuteMission();return {profile:'kedy',today:m,reuse:currentReusePhrase(m.phrase)}},",
              "  getTalkPrep:function(){var m=currentCommuteMission();return {today:m,reuse:currentReusePhrase(m.phrase)}},"
          )
          exec(compile(source, 'tools/flowz_v460_leni_prep.py', 'exec'))
          PY

      - name: Syntax check
        run: node --check flowz-app.js

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: Regression tests
        run: npm test

      - name: Commit tested app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowz-app.js flowz-v3-duo.css flowz-v3-duo.html index.html package.json package-lock.json tests/stability.spec.js CHANGELOG-v4.6.0.md
          git commit -m "Add Leni Talk Prep quick start [patched]"
          git push origin HEAD:fix/leni-talk-prep
