name: Flowz v4.5.2 Talk Prep Colors

on:
  push:
    branches:
      - fix/talk-prep-tappable-colors

permissions:
  contents: write

jobs:
  apply-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/talk-prep-tappable-colors
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply patch
        run: python tools/flowz_v452_patch.py

      - name: Syntax check
        run: node --check flowz-app.js

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps webkit

      - name: Regression tests
        run: npm test

      - name: Commit tested app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowz-app.js flowz-v3-duo.css flowz-v3-duo.html index.html package.json package-lock.json tests/stability.spec.js CHANGELOG-v4.5.2.md
          git commit -m "Style Talk Prep tappable rows [patched]"
          git push origin HEAD:fix/talk-prep-tappable-colors
