name: COMMUTE r6 CI

on:
  pull_request:
    branches: [main]

jobs:
  webkit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node --check flowz-v4.8.5-commute-continuity.js
      - run: npx playwright test --browser=webkit
