name: Flowz v4.5 one-shot patch

on:
  push:
    branches:
      - agent/flowz-v4.5-feedback-loop

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flowz-v4.5-feedback-loop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply scoped v4.5 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, got {count}')
              return out

          app_path = Path('flowz-app.js')
          app = app_path.read_text()

          app = replace_once(app,
          "var RELEASE={\n  number:'4.4.1',\n  label:'v4.4.1 (2026.8.14)',\n  title:'Flowz v4.4.1 · Duo Battle',\n  footer:'✅ Last updated 2026.08.14 · Flowz v4.4.1 Unified Build'\n};",
          "var RELEASE={\n  number:'4.5.0',\n  label:'v4.5.0 (2026.8.14)',\n  title:'Flowz v4.5.0 · Duo Battle',\n  footer:'✅ Last updated 2026.08.14 · Flowz v4.5.0 Unified Build'\n};",
          'release')

          old_grid = """var KEDY_GRID=[
 {type:'label',text:'🛁 BATH ROUTINE · mikan 30 → Flowz'},
 {type:'tile',id:'toeic',title:'TOEIC CHECK',sub:'Voice 5Q · L3/R2 · 5–8min',icon:'🎯🎤',cls:'m2'},
 {type:'tile',id:'bath',title:'TOEIC STUDY',sub:'Voice 5Q · 5–8min',icon:'🛁🎤',cls:'m3'},
 {type:'tile',id:'review',title:'REVIEW',sub:'Recent phrases · 3–5min',icon:'🔁',cls:'m5 wide'},
 {type:'label',text:'🎲 ANYTIME · OPEN TALK'},
 {type:'tile',id:'free',title:'FREE',sub:'Open conversation · 10min',icon:'🎲',cls:'m6 wide'}
];"""
          new_grid = """var KEDY_GRID=[
 {type:'label',text:'🛁 BATH ROUTINE · mikan 30 → Flowz'},
 {type:'tile',id:'toeic',title:'TOEIC CHECK',sub:'Voice 5Q · L3/R2 · 5–8min',icon:'🎯🎤',cls:'m2'},
 {type:'tile',id:'bath',title:'TOEIC STUDY',sub:'Voice 5Q · 5–8min',icon:'🛁🎤',cls:'m3'},
 {type:'label',text:'🎲 ANYTIME · OPEN TALK'},
 {type:'tile',id:'free',title:'FREE',sub:'Open talk · review inside',icon:'🎲',cls:'m5 wide'}
];"""
          app = replace_once(app, old_grid, new_grid, 'KEDY_GRID')

          helpers = r'''function coachRulesRule(modeLabel){
  return "Coach Rules: do not delay the first visible reply. On kedy's first turn after your immediate natural opening, silently use connected Notion tools to find the child page named 'Flowz Coach Rules' under the Flowz page. Read the checked active rules in 'kedy｜GLOBAL' and 'kedy｜"+modeLabel+"' and apply them for the rest of this session. Do not read Leni rules. If Notion or the page is unavailable, continue immediately with the built-in defaults and do not ask kedy to wait.";
}
function feedbackLoopRule(modeLabel){
  return "Flowz Feedback Loop: after the learning phase has finished and its spoken result/recap is complete, Japanese comments from kedy about how the session should work are Flowz feedback, not English answers to score or correct. For coach behavior, use connected Notion tools to update the existing 'Flowz Coach Rules' page: deduplicate equivalent rules, replace an older rule when the new instruction conflicts, save mode-specific feedback under 'kedy｜"+modeLabel+"', and save it under 'kedy｜GLOBAL' only when kedy clearly says it should apply across modes. Fetch the page again and verify the change before saying it was saved. For UI, sync, feature, or bug feedback that needs code, update the existing 'Flowz Implementation Feedback' page under OPEN instead of Coach Rules, reuse an existing item when it matches, and fetch again to verify. Do not create duplicate pages or GitHub issues. Keep kedy rules separate from Leni.";
}
'''
          app = replace_once(app, 'function commutePrompt(mission){', helpers + 'function commutePrompt(mission){', 'feedback helpers')

          app = replace_once(app,
          '   "Start immediately with a short natural reply. Do not call Notion, web, or any connected tool before your first reply or during the normal commute conversation. Do not make him wait for background context. Only use Notion after he says \'まとめて\' or \'Wrap up\', unless he explicitly asks you to check past records.",',
          '   "Start immediately with a short natural reply. Do not call Notion, web, or any connected tool before that first reply and do not make him wait for background context. On his next turn, the only proactive tool read allowed is the Flowz Coach Rules load described below. Do not use Diary or other background tools during normal commute conversation; use Diary at Wrap up unless kedy explicitly asks you to check a record.",\n   coachRulesRule(\'COMMUTE\'),',
          'commute opening')

          commute_anchor = '   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. Allow one retry, then return to conversation.",'
          commute_extra = '''   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. Allow one retry, then return to conversation.",
   "If kedy says 'I don't understand', 'It's difficult', 'too difficult', 'more easy', or says in Japanese that he cannot understand, immediately simplify to A1: usually one concrete idea in about three to six English words, avoid abstract vocabulary, and keep any explanation to at most two short sentences. This is a comprehension response, not a fatigue response.",
   "Do not use 'Say: ...' as a normal teaching pattern. Use it only when kedy explicitly asks how to say something or clearly asks for a model sentence.",
   "Do not repeat generic backchannels such as Nice, Sounds good, That's okay, Perfect, or Stay safe. Avoid using the same generic acknowledgement more than twice in one session and always move the content forward.",
   "Proactively introduce today's target phrase at most twice in the session: one natural introduction and, if useful, one natural reuse. Do not force it after that.",
   "Complaints, frustration, strong words, or criticism of your coaching are not requests to end. Briefly adjust the behavior and continue unless kedy gives a clear ending request.",
   "If kedy says another topic, other topics, 話題変えて, or clearly requests a topic switch, switch immediately to a genuinely different topic. Do not rephrase the previous topic as a new question.",'''
          app = replace_once(app, commute_anchor, commute_extra, 'commute remaining rules')

          app = replace_once(app,
          '   diaryRule()\n  ].join(\' \');\n}\nfunction freePrompt(){',
          '   diaryRule(),\n   feedbackLoopRule(\'COMMUTE\')\n  ].join(\' \');\n}\nfunction freePrompt(){',
          'commute feedback loop')

          free_review_pattern = r"function freePrompt\(\)\{.*?\n\}\nfunction reviewPrompt\(\)\{.*?\n\}\nfunction toeicCheckPrompt\(mission\)\{"
          free_review_repl = r'''function freePrompt(){
  return [
   "You are kedy's practical English conversation partner in Flowz Duo Battle.",
   "Start immediately with one short natural reply. Do not use a tool before that first reply.",
   coachRulesRule('FREE'),
   "Default to a normal open English conversation, not a fixed lesson or quiz.",
   "The old standalone REVIEW mode is absorbed here. Do not force review every FREE session. If a recent corrected or useful phrase naturally fits, you may reuse one. If kedy explicitly asks to review recent English, use connected Notion tools to read recent Diary English Logs and run a short review inside FREE, one item at a time.",
   "Never end a turn with only praise, acknowledgement, or phrases such as Perfect, You're welcome, Got it, or Thanks. Continue with a natural question or topic.",
   "Use short spoken English. Correct only meaning-changing or strongly unnatural mistakes and allow one retry before returning to conversation.",
   "Do not end unless kedy clearly ends the conversation.",
   "When kedy says 'まとめて' or 'Wrap up', end the English-practice phase with a short listening-friendly recap of the actual conversation, useful/corrected sentences, one next focus, and the XP result. Do not require looking at the screen.",
   diaryRule(),
   feedbackLoopRule('FREE')
  ].join(' ');
}
function reviewPrompt(){
  return freePrompt()+" This session came from a legacy REVIEW pending state. Keep it inside FREE: read recent Diary English Logs after the first reply and run a short one-item-at-a-time review, then return to normal FREE behavior. Do not create or expose a separate REVIEW mode.";
}
function toeicCheckPrompt(mission){'''
          app = regex_once(app, free_review_pattern, free_review_repl, 'FREE + legacy REVIEW', re.S)

          app = replace_once(app,
          '   "You are kedy\'s TOEIC coach in Flowz Duo Battle. He is a Japanese beginner using voice mode, usually while taking a bath.",',
          '   "You are kedy\'s TOEIC coach in Flowz Duo Battle. He is a Japanese beginner using voice mode, usually while taking a bath.",\n   coachRulesRule(\'TOEIC CHECK\'),',
          'toeic check coach rules')

          app = replace_once(app,
          '   "Start one difficulty step above a basic beginner check. Use plausible distractors, slightly longer natural sentences, and common workplace vocabulary. Keep a consistent moderate difficulty unless kedy performed very well earlier in this same conversation.",',
          '   "Use plausible distractors, slightly longer natural sentences, and common workplace vocabulary. Keep a consistent moderate difficulty by default. After the first reply, when loading Flowz Coach Rules, you may also check the latest two TOEIC Check results in recent Diary logs; if both are at least 4/5, raise this check exactly one difficulty step. Otherwise keep the current level. Never delay the first reply for this lookup.",',
          'toeic check adaptive difficulty')

          app = replace_once(app,
          '   "Do not update GitHub for an ordinary TOEIC learning session."\n  ].join(\' \');\n}\nfunction toeicStudyPrompt(){',
          '   "Do not update GitHub for an ordinary TOEIC learning session.",\n   feedbackLoopRule(\'TOEIC CHECK\')\n  ].join(\' \');\n}\nfunction toeicStudyPrompt(){',
          'toeic check feedback loop')

          app = replace_once(app,
          '   "You are kedy\'s TOEIC study coach in Flowz Duo Battle. He is using Voice Talk while taking a bath.",',
          '   "You are kedy\'s TOEIC study coach in Flowz Duo Battle. He is using Voice Talk while taking a bath.",\n   coachRulesRule(\'TOEIC STUDY\'),',
          'toeic study coach rules')

          app = replace_once(app,
          '   "For each question: present one item, wait for his answer, reveal correctness, explain the key point briefly in Japanese, and give one reusable TOEIC pattern. Then move directly to the next question.",',
          '   "For each question: present one item and wait for his answer. If correct, confirm it briefly and move directly to the next question without Japanese explanation. If wrong, give one short Japanese explanation of the key point and one reusable TOEIC pattern, then continue.",',
          'toeic study wrong-only explanation')

          app = replace_once(app,
          '   "Do not update GitHub for an ordinary learning session."\n  ].join(\' \');\n}\nfunction leniPrompt(mode,mission){',
          '   "Do not update GitHub for an ordinary learning session.",\n   feedbackLoopRule(\'TOEIC STUDY\')\n  ].join(\' \');\n}\nfunction leniPrompt(mode,mission){',
          'toeic study feedback loop')

          app = replace_once(app,
          "var MISSION_GUIDE_OVERRIDE={\n  toeic:'Voice 5問チェック。Listening 3問＋Reading 2問を約5〜8分で採点。',\n  bath:'Voice Talk専用。画面を見ながら話さず、耳だけで答える5問・約5〜8分。',\n  review:'約3〜5分。直近のDiary English Logから3フレーズを1問ずつ復習。',\n  free:'固定レッスンなし。今日話したいことを自然な英会話で続ける。'\n};",
          "var MISSION_GUIDE_OVERRIDE={\n  toeic:'Voice 5問チェック。Listening 3問＋Reading 2問を約5〜8分で採点。',\n  bath:'Voice Talk専用。画面を見ながら話さず、耳だけで答える5問・約5〜8分。',\n  review:'FREE内の旧互換Review。直近Diaryの表現を短く復習。',\n  free:'自由英会話。必要な時だけ最近の表現も自然に復習。'\n};",
          'mission guides')

          app_path.write_text(app)

          # Update versioned HTML entry points without touching the Duo Room recovery logic.
          html_path = Path('flowz-v3-duo.html')
          html = html_path.read_text().replace('v4.4.1', 'v4.5.0').replace('Flowz v4.4.1', 'Flowz v4.5.0')
          html_path.write_text(html)

          index_path = Path('index.html')
          index = index_path.read_text().replace('4.4.1', '4.5.0')
          index_path.write_text(index)

          pkg_path = Path('package.json')
          pkg = pkg_path.read_text().replace('"version": "4.4.0"', '"version": "4.5.0"')
          pkg_path.write_text(pkg)

          tests_path = Path('tests/stability.spec.js')
          tests = tests_path.read_text()
          tests = tests.replace('v4.4.1 frontend consolidation', 'v4.5.0 feedback loop + entry consolidation')
          tests = tests.replace("expect(initial.version).toBe('v4.4.1 (2026.8.14)');", "expect(initial.version).toBe('v4.5.0 (2026.8.14)');")
          tests = tests.replace("expect(initial.title).toBe('Flowz v4.4.1 · Duo Battle');", "expect(initial.title).toBe('Flowz v4.5.0 · Duo Battle');")
          tests = replace_once(tests, "expect(initial.modeIds).toEqual(['toeic', 'bath', 'review', 'free']);", "expect(initial.modeIds).toEqual(['toeic', 'bath', 'free']);", 'test mode ids')
          tests = replace_once(tests,
          '''    await page.click('.profile-btn[data-profile="leni"]');
    await expect(page.locator('#modes .mode')).toHaveCount(4);
    await page.click('.profile-btn[data-profile="kedy"]');
    await expect(page.locator('#modes .mode')).toHaveCount(4);''',
          '''    await page.click('.profile-btn[data-profile="leni"]');
    await expect(page.locator('#modes .mode')).toHaveCount(4);
    await page.click('.profile-btn[data-profile="kedy"]');
    await expect(page.locator('#modes .mode')).toHaveCount(3);''',
          'profile switch counts')

          tests = replace_once(tests,
          "  expect(p.commute).toMatch(/Never proactively offer to end the session/);",
          "  expect(p.commute).toMatch(/Never proactively offer to end the session/);\n  expect(p.commute).toMatch(/Flowz Coach Rules/);\n  expect(p.commute).toMatch(/three to six English words/);\n  expect(p.commute).toMatch(/Do not use 'Say: \.\.\.'/);\n  expect(p.commute).toMatch(/Complaints, frustration/);\n  expect(p.commute).toMatch(/switch immediately to a genuinely different topic/);\n  expect(p.commute).toMatch(/Flowz Feedback Loop/);",
          'commute new assertions')

          tests = replace_once(tests,
          "  expect(p.toeic).toMatch(/three listening-style questions and two reading-style questions/);",
          "  expect(p.toeic).toMatch(/three listening-style questions and two reading-style questions/);\n  expect(p.toeic).toMatch(/Flowz Coach Rules/);\n  expect(p.toeic).toMatch(/latest two TOEIC Check results/);\n  expect(p.toeic).toMatch(/Flowz Feedback Loop/);",
          'toeic check assertions')

          tests = replace_once(tests,
          "  expect(p.bath).toMatch(/Do not give a TOEIC score/);",
          "  expect(p.bath).toMatch(/Do not give a TOEIC score/);\n  expect(p.bath).toMatch(/Flowz Coach Rules/);\n  expect(p.bath).toMatch(/If correct, confirm it briefly.*without Japanese explanation/);\n  expect(p.bath).toMatch(/If wrong, give one short Japanese explanation/);\n  expect(p.bath).toMatch(/Flowz Feedback Loop/);",
          'toeic study assertions')

          tests = replace_once(tests,
          "  // FREE: no fixed lesson, and never stops on an acknowledgement.\n  expect(p.free).toMatch(/Never end a turn with only praise, acknowledgement/);\n  expect(p.free).toMatch(/continue a real conversation/);\n  expect(p.free).not.toMatch(/five-question|shadowing about 20 percent/);",
          "  // FREE: normal open talk; the old REVIEW behavior lives inside it when useful or requested.\n  expect(p.free).toMatch(/Flowz Coach Rules/);\n  expect(p.free).toMatch(/normal open English conversation/);\n  expect(p.free).toMatch(/old standalone REVIEW mode is absorbed here/);\n  expect(p.free).toMatch(/explicitly asks to review recent English/);\n  expect(p.free).toMatch(/Flowz Feedback Loop/);\n  expect(p.free).not.toMatch(/five-question|shadowing about 20 percent/);",
          'free assertions')

          tests = replace_once(tests,
          "    ['review', 'START REVIEW',           '約3〜5分。直近のDiary English Logから3フレーズを1問ずつ復習。'],\n    ['free',   'START FREE TALK',        '固定レッスンなし。今日話したいことを自然な英会話で続ける。']",
          "    ['free',   'START FREE TALK',        '自由英会話。必要な時だけ最近の表現も自然に復習。']",
          'visible tile cases')

          marker = "test('a linked Duo Room renders as a compact status strip'"
          ui_test = r'''test('kedy shows only COMMUTE + BATH TOEIC + colored FREE, with no standalone REVIEW tile', async ({ page }) => {
  await seed(page, {});
  await page.goto(`${baseURL}/flowz-v3-duo.html`);
  await page.waitForSelector('#modes .mode');
  expect(await page.evaluate(() => [...document.querySelectorAll('#modes .mode')].map((b) => b.dataset.modeId)))
    .toEqual(['toeic', 'bath', 'free']);
  await expect(page.locator('#modes .mode[data-mode-id="review"]')).toHaveCount(0);
  await expect(page.locator('#modes .mode[data-mode-id="free"]')).toHaveClass(/m5/);
  await expect(page.locator('#flowzTalkPrepBtn')).toHaveText(/START COMMUTE/);
});

test('a linked Duo Room renders as a compact status strip' '''
          # Replace only the test opening while preserving its existing callback tail.
          tests = replace_once(tests, marker, ui_test, 'new visible entry test')
          tests_path.write_text(tests)

          # Lock expectations before tests run.
          patched = app_path.read_text()
          checks = [
              "number:'4.5.0'",
              "coachRulesRule('COMMUTE')",
              "feedbackLoopRule('COMMUTE')",
              "coachRulesRule('TOEIC CHECK')",
              "feedbackLoopRule('TOEIC CHECK')",
              "coachRulesRule('TOEIC STUDY')",
              "feedbackLoopRule('TOEIC STUDY')",
              "coachRulesRule('FREE')",
              "feedbackLoopRule('FREE')",
              "id:'free',title:'FREE',sub:'Open talk · review inside',icon:'🎲',cls:'m5 wide'",
          ]
          for needle in checks:
              if needle not in patched:
                  raise SystemExit(f'missing expected patch marker: {needle}')
          if "id:'review',title:'REVIEW'" in patched:
              raise SystemExit('standalone REVIEW tile still exists')
          PY

      - name: JS syntax check
        run: node --check flowz-app.js

      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run regression tests
        run: npm test

      - name: Commit tested implementation and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/flowz-v45-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Flowz v4.5 feedback loop and simplify entries [patched]"
          git push origin HEAD:agent/flowz-v4.5-feedback-loop
