name: Apply Flowz 4.4.1 patch

on:
  push:
    branches:
      - agent/flowz-4.4.1-commute-duo-compact

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Flowz 4.4.1 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Flowz changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}')
              p.write_text(s.replace(old, new, 1))

          # Release marker/cache key.
          replace_once('flowz-app.js', "var RELEASE={\n  number:'4.4.0',\n  label:'v4.4.0 (2026.8.7)',\n  title:'Flowz v4.4.0 · Duo Battle',\n  footer:'✅ Last updated 2026.08.07 · Flowz v4.4.0 Unified Build'\n};", "var RELEASE={\n  number:'4.4.1',\n  label:'v4.4.1 (2026.8.14)',\n  title:'Flowz v4.4.1 · Duo Battle',\n  footer:'✅ Last updated 2026.08.14 · Flowz v4.4.1 Unified Build'\n};")

          # Issue #33: commute coaching behavior.
          replace_once('flowz-app.js',
              '   "Shadowing should usually be one compact mini-set of two or three sentences that summarizes what kedy actually talked about. Say one sentence, let him repeat once, then continue. If he casually echoes your praise or backchannel, acknowledge it once and continue; do not turn phrases such as \'nailed it\', \'spot on\', or \'sounds natural\' into a repetition chain. If he explicitly asks for more shadowing, give it.",\n   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. Allow one retry, then return to conversation.",',
              '   "Plan shadowing as one compact set of two or three short sentences overall, but speak exactly one short sentence per assistant turn. Never combine multiple shadowing sentences in one spoken turn. After each sentence, wait for exactly one repetition before giving the next. If a sentence is long, split it into natural spoken chunks and ask for one chunk at a time. Each chunk must be short enough to repeat from audio alone. If he casually echoes your praise or backchannel, acknowledge it once and continue; do not turn phrases such as \'nailed it\', \'spot on\', or \'sounds natural\' into a repetition chain. If he explicitly asks for more shadowing, give it.",\n   "If kedy says he is tired, low, unmotivated, anxious, or not in the mood, do not offer an easier lesson, rest, stopping, or ending because of that. You may slow the pacing slightly, but keep normal English practice active unless he explicitly asks to stop English practice.",\n   "If kedy rejects or redirects your advice or topic—for example, says he wants to understand his mind or feeling instead of hearing \'small steps\'—immediately follow the new direction. Do not repeat or defend the previous coaching frame.",\n   "Use short natural spoken English. Correct only meaning-changing or strongly unnatural mistakes. Allow one retry, then return to conversation.",')
          replace_once('flowz-app.js',
              '   "Never end a turn with only praise, acknowledgement, or a closing phrase such as \'Perfect\', \'You\'re welcome\', \'Got it\', or \'Thanks\'. After a brief acknowledgement, immediately continue with a natural question, topic, or next sentence. Do not close the conversation until kedy explicitly ends it.",',
              '   "Never end a turn with only praise, acknowledgement, or a closing phrase such as \'Perfect\', \'You\'re welcome\', \'Got it\', or \'Thanks\'. After a brief acknowledgement, immediately continue with a natural question, topic, or next sentence. Never proactively offer to end the session. Do not close the conversation until kedy explicitly ends it.",')

          # Duo Sync: truthful live status plus compact linked layout.
          replace_once('flowz-app.js',
              "  var cloud=loadCloud(),connected=!!cloud.roomId;\n  panel.dataset.status=connected?'connected':cloudPanelState.status;\n  var html='<div class=\"cloud-head\"><div class=\"cloud-title\">☁️ DUO SYNC</div><span class=\"cloud-status\">'+escapeHtml(connected?'CONNECTED':cloudPanelState.status==='error'?'ERROR':'SETUP')+'</span></div>';\n  if(!connected){",
              "  var cloud=loadCloud(),linked=!!cloud.roomId,connected=linked&&cloudPanelState.status==='connected';\n  var visibleStatus=cloudPanelState.status==='error'?'error':connected?'connected':linked?'loading':cloudPanelState.status;\n  var statusLabel=cloudPanelState.status==='error'?'ERROR':connected?'CONNECTED':linked?'SYNCING':'SETUP';\n  panel.dataset.status=visibleStatus;\n  var html='<div class=\"cloud-head\"><div class=\"cloud-title\">☁️ DUO SYNC</div><span class=\"cloud-status\">'+escapeHtml(statusLabel)+'</span></div>';\n  if(!linked){")
          replace_once('flowz-app.js',
              "    var members=cloudPanelState.members||[],hasKedy=members.indexOf('kedy')>=0,hasLeni=members.indexOf('leni')>=0;\n    html+='<p class=\"cloud-message\">この端末は <b>'+escapeHtml(profileName(cloud.profile))+'</b> として同期中</p>'+\n      '<div class=\"cloud-code\"><span>Duo Code</span><b>'+escapeHtml(cloud.roomCode||'------')+'</b><button class=\"cloud-copy\" data-cloud-action=\"copy\">COPY</button></div>'+\n      '<div class=\"cloud-members\"><span class=\"cloud-member '+(hasKedy?'on':'')+'\">'+(hasKedy?'✓ ':'')+'kedy</span><span class=\"cloud-member '+(hasLeni?'on':'')+'\">'+(hasLeni?'✓ ':'')+'Leni</span><button class=\"cloud-member\" data-cloud-action=\"sync\">↻ SYNC</button></div>';\n    html+=cloudPanelState.latest?'<div class=\"cloud-latest\">🔥 '+escapeHtml(profileName(cloudPanelState.latest.profile))+' completed '+escapeHtml(cloudPanelState.latest.title||cloudPanelState.latest.mode||'SESSION')+' · +'+escapeHtml(cloudPanelState.latest.xp)+' XP · '+escapeHtml(relativeTime(cloudPanelState.latest.completed_at))+'</div>':'<div class=\"cloud-latest\">相手の学習完了がここへ即時表示される</div>';\n    html+='<div class=\"cloud-note\">既存履歴は保持／オフライン時は端末保存し、復帰後に同期</div>';",
              "    var members=cloudPanelState.members||[],hasKedy=members.indexOf('kedy')>=0,hasLeni=members.indexOf('leni')>=0;\n    html+='<div class=\"cloud-compact\"><div class=\"cloud-compact-members\"><span class=\"cloud-member '+(hasKedy?'on':'')+'\">'+(hasKedy?'✓ ':'')+'kedy</span><span class=\"cloud-member '+(hasLeni?'on':'')+'\">'+(hasLeni?'✓ ':'')+'Leni</span></div><button class=\"cloud-room\" data-cloud-action=\"copy\">ROOM '+escapeHtml(cloud.roomCode||'------')+'</button></div>';\n    if(cloudPanelState.status==='error')html+='<div class=\"cloud-error\">'+escapeHtml(cloudPanelState.message||'同期エラー')+'</div>';")

          # Compact connected/linking visual treatment. Full setup stays unchanged when no Room exists.
          css = Path('flowz-v3-duo.css')
          s = css.read_text()
          anchor = '#flowzCloudPanel .cloud-note{margin-top:9px;color:#747b84;font-size:10px;line-height:1.45}\n'
          if s.count(anchor) != 1:
              raise SystemExit('flowz-v3-duo.css: compact style anchor mismatch')
          compact = anchor + '''#flowzCloudPanel .cloud-compact{display:flex;align-items:center;justify-content:space-between;gap:8px}\n#flowzCloudPanel .cloud-compact-members{display:flex;align-items:center;gap:6px;min-width:0}\n#flowzCloudPanel .cloud-compact .cloud-member{padding:4px 8px;font-size:10px}\n#flowzCloudPanel .cloud-room{border:1px solid #343a42;background:transparent;color:#8f969f;border-radius:999px;padding:4px 8px;font:850 9px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;white-space:nowrap}\n#flowzCloudPanel .cloud-room:active{transform:translateY(1px)}\n#flowzCloudPanel .cloud-error{margin-top:7px;color:#ff9e6d;font-size:10px;line-height:1.35}\n#flowzCloudPanel:has(.cloud-compact){padding:10px 12px}\n#flowzCloudPanel:has(.cloud-compact) .cloud-head{margin-bottom:7px}\n#flowzCloudPanel:has(.cloud-compact) .cloud-title{font-size:13px}\n#flowzCloudPanel:has(.cloud-compact) .cloud-status{padding:5px 8px;font-size:9px}\n'''
          css.write_text(s.replace(anchor, compact, 1))

          # HTML/cache keys.
          html = Path('flowz-v3-duo.html')
          s = html.read_text()
          for old, new in [
              ('Flowz v4.4.0 (2026.8.7) · Duo Battle','Flowz v4.4.1 (2026.8.14) · Duo Battle'),
              ('flowz-v3-duo.css?v=4.4.0','flowz-v3-duo.css?v=4.4.1'),
              ('v4.4.0 (2026.8.7)','v4.4.1 (2026.8.14)'),
              ('✅ Last updated 2026.08.07 · Flowz v4.4.0 Unified Build','✅ Last updated 2026.08.14 · Flowz v4.4.1 Unified Build'),
              ('flowz-app.js?v=4.4.0','flowz-app.js?v=4.4.1'),
          ]:
              if old not in s:
                  raise SystemExit(f'flowz-v3-duo.html missing: {old}')
              s = s.replace(old, new)
          html.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          if '4.4.0' not in s:
              raise SystemExit('index.html: 4.4.0 marker missing')
          index.write_text(s.replace('4.4.0','4.4.1'))

          # Regression coverage: release, Issue #33, compact connected panel.
          tests = Path('tests/stability.spec.js')
          s = tests.read_text().replace('v4.4.0 (2026.8.7)','v4.4.1 (2026.8.14)').replace('Flowz v4.4.0 · Duo Battle','Flowz v4.4.1 · Duo Battle')
          old = "  expect(p.commute).toMatch(/reply like a normal conversation partner once/); // no greeting ping-pong\n"
          new = old + "  expect(p.commute).toMatch(/speak exactly one short sentence per assistant turn/);\n  expect(p.commute).toMatch(/Never combine multiple shadowing sentences in one spoken turn/);\n  expect(p.commute).toMatch(/wait for exactly one repetition before giving the next/);\n  expect(p.commute).toMatch(/do not offer an easier lesson, rest, stopping, or ending/);\n  expect(p.commute).toMatch(/immediately follow the new direction/);\n  expect(p.commute).toMatch(/Never proactively offer to end the session/);\n"
          if s.count(old) != 1:
              raise SystemExit('tests: commute assertion anchor mismatch')
          s = s.replace(old, new, 1)
          marker = "test('a pending session is restored on reload and shown as started', async ({ page }) => {"
          compact_test = r'''test('a linked Duo Room renders as a compact status strip', async ({ page }) => {
  await seed(page, {
    flowz_duo_data: emptyState,
    flowz_duo_cloud_v1: JSON.stringify({
      roomId: 'test-room-id', roomCode: '829018', profile: 'kedy',
      linkedAt: new Date().toISOString(), migratedAt: new Date().toISOString()
    })
  });
  await page.goto(`${baseURL}/flowz-v3-duo.html`);
  await page.waitForSelector('#flowzCloudPanel .cloud-compact');

  await expect(page.locator('#flowzCloudPanel .cloud-compact')).toHaveCount(1);
  await expect(page.locator('#flowzCloudPanel .cloud-room')).toContainText('829018');
  await expect(page.locator('#flowzCloudPanel .cloud-code')).toHaveCount(0);
  await expect(page.locator('#flowzCloudPanel .cloud-latest')).toHaveCount(0);
  await expect(page.locator('#flowzCloudPanel .cloud-note')).toHaveCount(0);
});

'''
          if s.count(marker) != 1:
              raise SystemExit('tests: insertion marker mismatch')
          tests.write_text(s.replace(marker, compact_test + marker, 1))

          Path('CHANGELOG-v4.4.1.md').write_text('''# Flowz v4.4.1 — 2026-08-14\n\n- Commute shadowing is now strictly one short sentence/chunk per turn, waiting for one repetition before continuing.\n- Tired/low/unmotivated/anxious comments no longer trigger easier-lesson, rest, or ending suggestions; only pacing may slow unless kedy explicitly stops English practice.\n- User topic corrections immediately override the previous coaching/advice direction.\n- The coach never proactively offers to end a commute session.\n- Connected Duo Sync is reduced to a compact status strip with member state and tappable Room code; verbose code/activity/note rows are removed in the linked state.\n- Duo status now distinguishes CONNECTED, SYNCING, and ERROR instead of treating a saved Room ID as proof of a live connection.\n''')
          PY

      - name: Static checks
        run: |
          node --check flowz-app.js
          git diff --check

      - name: Install tests
        run: |
          npm ci
          npx playwright install chromium

      - name: Run regression suite
        run: npm test

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowz-app.js flowz-v3-duo.css flowz-v3-duo.html index.html tests/stability.spec.js CHANGELOG-v4.4.1.md
          git commit -m "Flowz v4.4.1: tighten commute and compact Duo Sync"
          git push origin HEAD
