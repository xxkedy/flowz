name: Flowz v4.8.6 QA

on:
  push:
    branches:
      - flowz-v4.8.6-diary-sync
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node --check flowz-v4.8.6-diary-sync.js
      - run: npx playwright test --browser=webkit
