name: Flowz v4.5 apply

on:
  push:
    branches:
      - agent/flowz-v4.5-feedback-loop

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/flowz-v4.5-feedback-loop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply patch
        run: python tools/flowz_v45_patch.py

      - name: Syntax check
        run: node --check flowz-app.js

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Regression tests
        run: npm test

      - name: Commit tested app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flowz-app.js flowz-v3-duo.html index.html package.json package-lock.json tests/stability.spec.js CHANGELOG-v4.5.0.md
          git commit -m "Implement Flowz v4.5 feedback loop and simplify entries [patched]"
          git push origin HEAD:agent/flowz-v4.5-feedback-loop
